plugins { id 'com.android.application' }
android {
    lint {
        disable 'ProtectedPermissions'   // WRITE_SECURE_SETTINGS: istege bagli, adb ile verilir
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED' }
    }
    // Kalici imza: anahtar ve sifreler depoya konmaz, proje kokundeki keystore.properties dosyasindan okunur
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ks.load(new FileInputStream(ksFile))
    [storeFile: 'ANDROID_KEYSTORE_PATH', storePassword: 'ANDROID_STORE_PASSWORD',
     keyAlias: 'ANDROID_KEY_ALIAS', keyPassword: 'ANDROID_KEY_PASSWORD'].each { key, variable ->
        def value = System.getenv(variable)
        if (value != null) ks.setProperty(key, value)
    }
    def signingReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { ks.getProperty(it) }
    if (!ks.isEmpty() && !signingReady) {
        throw new GradleException('Release signing requires storeFile, storePassword, keyAlias and keyPassword.')
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingReady) signingConfig signingConfigs.release
        }
    }
    namespace 'com.abdullaherturk.duopanel'
    compileSdk 34
    defaultConfig {
        applicationId 'com.abdullaherturk.duopanel.streamboxfix'
        minSdk 24
        targetSdk 33
        versionCode 6
        versionName '1.0.5-streambox'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
